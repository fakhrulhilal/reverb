name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet --info

      - name: Build
        run: dotnet build Reverb.slnx -c Release

      - name: Test
        run: dotnet test Reverb.slnx -c Release --no-build --logger "console;verbosity=normal"

      # The sample notebook must run with plain `dotnet run` on every OS.
      - name: Notebook runs with dotnet run
        shell: bash
        run: spikes/m0-directives/check.sh
