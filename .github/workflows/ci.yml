name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Kernels log their startup steps to stderr, which shows up when one doesn't start.
      REVERB_KERNEL_TRACE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The editor frontend is built by `dotnet build`, so Node is needed from here on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - run: dotnet --info

      - name: Build
        run: dotnet build Reverb.slnx -c Release

      - name: Test
        run: dotnet test Reverb.slnx -c Release --no-build --logger "console;verbosity=normal"

      # The sample notebook must run with plain `dotnet run` on every OS.
      - name: Notebook runs with dotnet run
        shell: bash
        run: spikes/m0-directives/check.sh

      - name: Install Playwright
        working-directory: tests/e2e
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: tests/e2e
        env:
          REVERB_CONFIGURATION: Release
        run: npx playwright test

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/e2e/playwright-report
          retention-days: 7
